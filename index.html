<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#14213d;--mute:#5b6478;--line:#dde3ef;--brand:#1d3a8a;--onbrand:#fff;--gold:#f2a900;--good:#1e8e5a;--goodbg:#e3f5ec;--warnbg:#fff3d6;--me:#e6ecfb;

:root[data-theme="dark"]{--bg:#0f1526;--card:#182038;--ink:#eef1fa;--mute:#a3acc4;--line:#2a3558;--brand:#8fb0ff;--onbrand:#0f1526;--good:#5fd6a0;--goodbg:#143b2b;--warnbg:#3d3213;--me:#22305a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Telugu","Noto Sans Kannada","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;font-size:17px}
main{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:12px 14px}
.scr{flex:1;overflow-y:auto;min-height:0}
.hidden{display:none!important}
h1{font-size:25px;line-height:1.25;margin:8px 0 6px}
p.sub{color:var(--mute);margin:0 0 18px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:50px;padding:10px 16px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.list{display:grid;gap:12px}
.list button{background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:21px;text-align:left}
.list small{display:block;font-size:14px;color:var(--mute);font-weight:400}
details.cat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 12px;margin-bottom:10px}
details.cat summary{cursor:pointer;font-weight:700;font-size:20px;min-height:48px;display:flex;align-items:center}
details.cat .list{padding:4px 0 12px}
details.cat .list button{font-size:18px;background:var(--bg)}
.today{background:var(--goodbg);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.today .lbl{color:var(--mute);font-size:15px;margin-bottom:6px}
.tbtn{width:100%;background:var(--gold);color:#14213d;font-size:19px;text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.link{background:none;color:var(--brand);min-height:44px;padding:6px 2px}
#msgs{flex:1;overflow-y:auto;min-height:0;padding:6px 0}
.b{border-radius:18px;padding:12px 14px;margin:10px 0;max-width:92%}
.ai{background:var(--card);border:2px solid var(--line)}
.me{background:var(--me);margin-left:auto}
.en{font-size:21px;font-weight:700;line-height:1.35}
.hn{color:var(--brand);margin-top:4px}
.mini{min-height:40px;padding:4px 12px;background:var(--gold);color:#14213d;margin-top:6px}
.fbk{background:var(--goodbg);border-radius:14px;padding:10px 14px;margin:8px 0}
.fx{margin-top:6px;background:var(--warnbg);border-radius:10px;padding:8px 10px}
.why{color:var(--mute);font-size:15px;margin-top:2px}
.think{color:var(--mute)}
#chips{padding:4px 0}
#chips .lbl{color:var(--mute);font-size:14px}
#chips button{background:var(--card);color:var(--ink);border:2px solid var(--gold);margin:4px 6px 0 0;min-height:44px;font-weight:600;text-align:left}
.bar2{padding-top:6px}
#mic{width:100%;background:var(--brand);color:var(--onbrand);font-size:20px;min-height:58px}
#mic.rec{animation:p 1s infinite}
@keyframes p{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#mic.rec{animation:none}}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.row button{background:var(--ink);color:var(--bg)}
.end{text-align:center;background:var(--goodbg);border-radius:16px;padding:16px;margin:10px 0}
.lk{display:block;text-decoration:none;text-align:center;border-radius:14px;padding:14px;font-weight:700;margin-top:10px;background:var(--gold);color:#14213d}
.go{width:100%;margin-top:10px;background:var(--ink);color:var(--bg)}
</style>
</head>

<main>
<section id="s1" class="scr">

  <div id="chips"></div>
  <div class="bar2" id="bar">
    <button id="mic"></button>
    <div class="row"><input id="txt" autocomplete="off"><button id="send"></button></div>
  </div>
</section>
</main>

function getDone(){try{return JSON.parse(load("done100")||"[]")}catch(e){return[]}}
var LN={te:"Telugu",kn:"Kannada",hi:"Hindi"};
var INSTR="You are a warm, patient English speaking partner for adult beginners in rural India. The learner speaks LANG. Role-play: ROLE Rules: Use very simple English, at most WORDS words per reply, and ask only one easy question at a time. The learner's words come from speech recognition, so ignore capital letters, punctuation and small recognition errors. If the learner's sentence has a real mistake, correct at most ONE mistake; otherwise set fix to null. Never be harsh. Reply with ONLY valid JSON, no markdown, in exactly this shape: {\"reply\":\"your next English line\",\"hint\":\"the reply translated into LANG, written in LANG script\",\"praise\":\"one short encouraging sentence in LANG (empty string if the learner has not spoken yet)\",\"fix\":null or {\"better\":\"the corrected English sentence\",\"why\":\"one short simple reason in LANG\"},\"try\":[\"an easy English answer the learner could say\",\"another easy answer\"]}";
var MAXT=50,fin=false,L=null,S=null,H=[],turns=0,busy=false,listening=false,rec=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function $(i){return document.getElementById(i)}
function t(){return UI[L]}
function el(tag,cls,txt,par){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(par)par.appendChild(e);return e}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function show(id){["s1","s2","s3"].forEach(function(x){$(x).classList.add("hidden")});$(id).classList.remove("hidden");if(id==="s3")$(id).style.display="flex"}
function say(txt){try{speechSynthesis.cancel();var m=new SpeechSynthesisUtterance(txt);m.lang="en-IN";m.rate=0.8;speechSynthesis.speak(m)}catch(e){}}
function down(){var m=$("msgs");m.scrollTop=m.scrollHeight}

function pickLang(l){
  L=l;save("lang",l);document.documentElement.lang=l;var u=t();
  $("chg").textContent=u.chg;$("picks").textContent=u.picks;$("back").textContent=u.back;
  $("mic").textContent=u.tap;$("txt").placeholder=u.typeph;$("send").textContent=u.send;
  var box=$("scn"),dn=getDone();box.textContent="";
  $("pg").textContent="✅ "+dn.length+" / "+SC.length;
  $("stop").textContent=u.stop;
  var ti=dayNum()%SC.length,td=$("td");td.textContent="";
  el("div","lbl","🔥 "+streak()+" "+u.streak,td);
  var tb=el("button","tbtn",u.today+": "+SC[ti].e+" "+SC[ti][l],td);tb.onclick=function(){begin(ti)};
  CATS.forEach(function(c,ci){
    var d=el("details","cat",null,box);d.open=(ci===OPEN);
    d.addEventListener("toggle",function(){if(d.open)OPEN=ci});
    el("summary",null,c.e+" "+c.n[CI[l]],d);
    var g=el("div","list",null,d);
    SC.forEach(function(s,i){if(s.cat!==ci)return;
      var b=el("button",null,(dn.indexOf(i)>-1?"✅ ":s.e+" ")+s[l],g);el("small",null,s.en,b);b.onclick=function(){begin(i)}});
  });
  show("s2");
}
function begin(i){
  S=i;H=[];turns=0;busy=false;fin=false;$("msgs").textContent="";$("chips").textContent="";
  $("bar").classList.remove("hidden");$("cnt").textContent="0 / "+MAXT;
  track("language-"+L);track("scenario-"+(i+1));show("s3");step(null);
}
function buildPrompt(msg){
  var tr=H.slice(-16).map(function(h){return (h.who==="ai"?"Partner: ":"Learner: ")+h.text}).join("\n");
  var words=[12,16,20,25][Math.min(3,Math.floor(getDone().length/10))];
  var tw=TW[(dayNum()+S)%TW.length];
  return INSTR.replace(/LANG/g,LN[L]).replace("WORDS",words).replace("ROLE","Situation: "+SC[S].en+". Choose a natural role for yourself (for example seller, clerk, doctor, neighbour or friend); the learner plays themselves.")
   +"\n\nThis is turn "+(turns+(msg?0:1))+" of "+MAXT+". Today's twist for variety: "+tw+". Move the conversation forward step by step like a real situation, never repeat earlier questions, bring in a new small event every few turns, and if the turn number is above "+(MAXT-6)+" start wrapping up politely."
   +"\n\nConversation so far (latest lines only):\n"+(tr||"(none)")+"\n\n"+(msg?"Learner just said: "+msg:"Start the conversation: greet the learner and ask the first simple question.");
}
async function askAI(prompt){
  var raw=null;
  if(window.claude&&window.claude.use){
    try{var sm=await window.claude.use("sample");if(sm){var r=await sm(prompt,{cache:false});raw=r.text}}catch(e){}
  }
  if(raw==null){
    var res=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt})});
    if(!res.ok)throw new Error("http");
    raw=(await res.json()).text;
  }
  raw=String(raw||"").replace(/```json|```/g,"");
  var a=raw.indexOf("{"),b=raw.lastIndexOf("}");
  try{var o=JSON.parse(raw.slice(a,b+1));if(!o.reply)throw 0;return o}
  catch(e){if(raw.trim())return{reply:raw.trim().slice(0,200),hint:"",praise:"",fix:null,try:[]};throw new Error("empty")}
}
async function step(msg){
  if(busy||fin)return;busy=true;$("chips").textContent="";
  var p=buildPrompt(msg),box=$("msgs");
  if(msg){el("div","b me",msg,box);H.push({who:"me",text:msg});turns++;if(turns===1)markDay();$("cnt").textContent=turns+" / "+MAXT;track("turn")}
  var th=el("div","think",t().think,box);down();
  try{
    var r=await askAI(p);th.remove();
    if(msg&&(r.praise||(r.fix&&r.fix.better))){
      var d=el("div","fbk",null,box);
      if(r.praise)el("div",null,"👍 "+r.praise,d);
      if(r.fix&&r.fix.better){
        var f=el("div","fx",null,d);el("b",null,t().better+" ",f);el("span",null,r.fix.better,f);
        var fb=el("button","mini","🔊",f);fb.onclick=function(){say(r.fix.better)};
        if(r.fix.why)el("div","why",r.fix.why,f);
      }
    }
    var a=el("div","b ai",null,box);el("div","en",r.reply,a);if(r.hint)el("div","hn",r.hint,a);
    var lb=el("button","mini","🔊",a);lb.onclick=function(){say(r.reply)};
    H.push({who:"ai",text:r.reply});say(r.reply);down();
    if(turns>=MAXT){finish()}else if(r.try&&r.try.length){
      var c=$("chips");el("div","lbl",t().say,c);
      r.try.slice(0,2).forEach(function(x){var cb=el("button",null,x,c);cb.onclick=function(){say(x);$("txt").value=x}});
    }
  }catch(e){th.remove();el("div","why",t().err,box);down()}
  busy=false;
}
function finish(){if(fin)return;fin=true;
  track("conversation-complete");var dn=getDone();if(dn.indexOf(S)<0){dn.push(S);save("done100",JSON.stringify(dn))}$("bar").classList.add("hidden");$("chips").textContent="";
  var e=el("div","end",null,$("msgs"));el("div","en","⭐⭐⭐",e);el("div",null,t().endt,e);
  if(FORM_LINK.indexOf("YOUR_")!==0){var a=el("a","lk",t().fbk,e);a.href=FORM_LINK;a.target="_blank";a.rel="noopener"}
  var g=el("button","go",t().again,e);g.onclick=function(){begin(S)};down();
}
function mic(){
  if(busy||listening)return;
  if(!SR){$("txt").focus();return}
  try{
    rec=new SR();rec.lang="en-IN";rec.interimResults=false;rec.maxAlternatives=1;
    rec.onstart=function(){listening=true;$("mic").classList.add("rec");$("mic").textContent=t().listening};
    rec.onend=function(){listening=false;$("mic").classList.remove("rec");$("mic").textContent=t().tap};
    rec.onresult=function(e){step(e.results[0][0].transcript)};
    rec.onerror=function(){$("txt").focus()};
    rec.start();
  }catch(e){$("txt").focus()}
}
function sendTxt(){var v=$("txt").value.trim();if(v){$("txt").value="";step(v)}}
document.querySelectorAll("#langs button").forEach(function(b){b.onclick=function(){pickLang(b.dataset.l)}});
$("stop").onclick=function(){if(!fin&&turns>0)finish()};
$("chg").onclick=function(){show("s1")};
$("back").onclick=function(){try{speechSynthesis.cancel()}catch(e){}pickLang(L)};
$("mic").onclick=mic;$("send").onclick=sendTxt;
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter")sendTxt()});
var saved=load("lang");if(saved&&UI[saved])pickLang(saved);
</script>
</body>
</html>
